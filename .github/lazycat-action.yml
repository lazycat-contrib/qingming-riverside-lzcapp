version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/qingming-riverside.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: git
    image: ""

build:
  run_buildscript: true

images: []

stores:
  official:
    # Official store publication is intentionally disabled; publish only to MiaoMiao Store.
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: 清明上河
    summary: 可交互的宋代沿河街市画卷：行走、乘船、街市故事与虹桥过船
